<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- Exactly the app's viewport meta, so the numbers below describe the app's situation. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#262624">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Claude Remote — 视口诊断</title>
<style>
  html, body { margin: 0; height: 100%; background: #262624; color: #f5f4ef;
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
  /* The three candidate heights, measured rather than assumed.
     The % bar must NOT be position:fixed — a fixed box resolves % against the viewport, so it
     would always match dvh and hide the very difference this page exists to show. Absolute with
     no positioned ancestor resolves against the initial containing block, which is the thing
     that loses the top safe-area inset. */
  #vh100  { position: fixed; top: 0; left: 0; width: 3px; height: 100vh;  background: #7fb069; }
  #dvh100 { position: fixed; top: 0; left: 6px; width: 3px; height: 100dvh; background: #e0b25f; }
  #pct100 { position: absolute; top: 0; left: 12px; width: 3px; height: 100%; background: #c96442; }
  #verdict { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.6;
    background: rgba(245,244,239,.05); border: 1px solid rgba(245,244,239,.12); }
  main { padding: max(env(safe-area-inset-top, 0px), 12px) 20px max(env(safe-area-inset-bottom, 0px), 12px) 24px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #a8a5a0; font-size: 12.5px; }
  table { border-collapse: collapse; width: 100%; font: 400 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  td { padding: 5px 0; border-bottom: 1px solid rgba(245,244,239,.07); vertical-align: top; }
  td.k { color: #a8a5a0; padding-right: 10px; white-space: nowrap; }
  td.v { text-align: right; word-break: break-all; }
  .flag { color: #e07a5f; }
  .ok { color: #7fb069; }
  button { width: 100%; margin-top: 18px; min-height: 50px; border-radius: 25px; border: none;
    background: #f5f4ef; color: #1f1e1c; font: 600 16px/1 inherit; }
  .legend { margin-top: 14px; color: #8a8781; font-size: 12px; line-height: 1.7; }
  .legend b { color: #cfccc5; }
</style>
</head>
<body>
<!-- Left edge: three colored bars, one per unit. If they end at different heights you can SEE
     which unit is lying, without reading a single number. -->
<div id="vh100"></div><div id="dvh100"></div><div id="pct100"></div>
<main>
  <h1>视口诊断</h1>
  <p class="sub">从主屏幕图标打开（不是 Safari 标签页），然后把这一屏发我。左边三条竖线分别是 100vh（绿）/ 100dvh（黄）/ 100%（橙，文档流高度）——谁短谁就在撒谎。</p>
  <div id="verdict"></div>
  <table id="out"></table>
  <button onclick="copy()">复制全部</button>
  <!-- Standalone has no back button and no address bar; without this you are stuck here. -->
  <button onclick="location.href='./'" style="background:none;color:#e5895f;border:1px solid rgba(245,244,239,.18)">返回 Claude Remote</button>
  <p class="legend">
    <b>display-mode</b> 是 standalone 才算真装成了 App。<br>
    <b>safe-area-inset-top</b> = 0 表示 iOS 没把状态栏做成透明的（走的是 manifest 安装路径），
    这时内容是被系统状态栏往下顶的，不是我们留的白。<br>
    <b>dvh ≠ innerHeight</b> 就是 iOS 26.0 那个底部空带的 bug（Apple 在 26.1 修了）。
  </p>
</main>
<script>
  const px = (v) => Math.round(v * 100) / 100;
  function inset(side) {
    const d = document.createElement('div');
    d.style.cssText = `position:fixed;top:0;left:0;width:0;height:0;padding-${side}:env(safe-area-inset-${side},0px)`;
    document.body.appendChild(d);
    const v = getComputedStyle(d)['padding' + side[0].toUpperCase() + side.slice(1)];
    d.remove();
    return v;
  }
  function unit(u) {
    const d = document.createElement('div');
    d.style.cssText = `position:fixed;top:0;left:0;width:0;height:100${u}`;
    document.body.appendChild(d);
    const v = px(d.getBoundingClientRect().height);
    d.remove();
    return v;
  }
  let rows = [];
  function collect() {
    const dm = ['standalone', 'fullscreen', 'minimal-ui', 'browser'].find((m) => matchMedia(`(display-mode: ${m})`).matches) || '?';
    const ih = window.innerHeight;
    const dvh = unit('dvh'), vh = unit('vh'), pct = px(document.documentElement.clientHeight);
    const vv = window.visualViewport;
    // The app sets html { height: 100dvh }, so <html>'s own rect IS the app shell's box.
    const hr = document.documentElement.getBoundingClientRect();
    const icbTop = document.getElementById('pct100').getBoundingClientRect().top; // absolute, top:0
    rows = [
      ['display-mode', dm, dm === 'standalone' ? 'ok' : 'flag'],
      ['navigator.standalone', String(window.navigator.standalone), ''],
      ['screen', `${screen.width}×${screen.height}`, ''],
      ['innerWidth×innerHeight', `${window.innerWidth}×${ih}`, ''],
      ['visualViewport', vv ? `${px(vv.width)}×${px(vv.height)} @${px(vv.offsetTop)}` : 'n/a', ''],
      ['devicePixelRatio', String(devicePixelRatio), ''],
      ['100vh', `${vh}px`, vh === ih ? '' : 'flag'],
      ['100dvh', `${dvh}px`, dvh === ih ? 'ok' : 'flag'],
      ['100% (文档流/ICB)', `${pct}px`, pct === ih ? 'ok' : 'flag'],
      ['innerHeight − 100%', `${px(ih - pct)}px`, ih === pct ? 'ok' : 'flag'],
      // Where the ICB actually starts, and where a 100dvh document box actually ends. This is
      // the app's own shell box: html is height:100dvh, so if its rect is not 0→innerHeight the
      // composer is off-screen and `overflow: hidden` makes it unreachable.
      ['<html> 盒子 y', `${px(hr.top)} → ${px(hr.bottom)}`, Math.abs(hr.top) < 1 && Math.abs(hr.bottom - ih) < 1 ? 'ok' : 'flag'],
      ['ICB 顶部偏移', `${px(icbTop)}px`, Math.abs(icbTop) < 1 ? 'ok' : 'flag'],
      ['inset top', inset('top'), inset('top') === '0px' ? 'flag' : 'ok'],
      ['inset bottom', inset('bottom'), ''],
      ['inset left/right', `${inset('left')} / ${inset('right')}`, ''],
      ['orientation', String(screen.orientation && screen.orientation.type), ''],
      ['userAgent', navigator.userAgent, ''],
    ];
    document.getElementById('out').innerHTML = rows
      .map(([k, v, c]) => `<tr><td class="k">${k}</td><td class="v ${c}">${v}</td></tr>`).join('');

    // Say which unit the app should be built on, so the page answers its own question.
    const say = [];
    say.push(dm === 'standalone'
      ? '<span class="ok">✓ 真的装成 App 了</span>'
      : `<span class="flag">⚠ display-mode 是 ${dm} —— 这不是从主屏幕图标打开的</span>`);
    if (dvh === ih && pct === ih) say.push('<span class="ok">✓ dvh 和 % 都等于窗口高度，两种写法都安全</span>');
    else if (dvh === ih) say.push(`<span class="flag">⚠ 用 dvh</span>：% 比窗口短 ${px(ih - pct)}px（视口顶部安全区没算进 ICB），底部会空出这么多`);
    else if (pct === ih) say.push(`<span class="flag">⚠ 用 %</span>：dvh 比窗口差 ${px(ih - dvh)}px（iOS 26.0 的 dvh 回归，26.1 已修）`);
    else say.push(`<span class="flag">⚠ dvh 和 % 都不等于 innerHeight（${px(ih - dvh)}px / ${px(ih - pct)}px）</span>`);
    say.push(Math.abs(hr.top) < 1 && Math.abs(hr.bottom - ih) < 1
      ? `<span class="ok">✓ &lt;html&gt; 盒子正好是 0 → ${px(ih)}</span>：dvh 的外壳严丝合缝`
      : `<span class="flag">⚠ &lt;html&gt; 盒子是 ${px(hr.top)} → ${px(hr.bottom)}，不是 0 → ${px(ih)}</span>：外壳偏了/溢出了，底部控件会被裁掉`);
    say.push(inset('top') === '0px'
      ? '<span class="flag">⚠ 顶部 inset = 0</span>：iOS 走 manifest 安装路径，状态栏不透明，内容是被系统往下顶的'
      : `✓ 顶部 inset = ${inset('top')}：状态栏是透明的，那条带子是灵动岛+状态栏的物理占位，必须留`);
    document.getElementById('verdict').innerHTML = say.join('<br>');
  }
  function copy() {
    const text = rows.map(([k, v]) => `${k}: ${v}`).join('\n');
    navigator.clipboard.writeText(text).then(
      () => { document.querySelector('button').textContent = '已复制 ✓'; },
      () => { document.querySelector('button').textContent = '复制失败，手动截图'; },
    );
  }
  collect();
  addEventListener('resize', collect);
  if (window.visualViewport) visualViewport.addEventListener('resize', collect);
</script>
</body>
</html>
