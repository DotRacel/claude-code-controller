name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is the point: 22.x is the floor in `engines` and in the esbuild target, and it is
  # the version that would break if anything reintroduced a dependency on Node's default type
  # stripping. Developing on 24 hides that class of bug entirely.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Smoke-test the published shape, not the source tree: run the bundle through a symlink the
      # way an installed bin is invoked. --help must print and exit 0.
      - name: Smoke-test the bundled CLI
        run: |
          ln -s "$PWD/dist/cli.mjs" /tmp/control-claude-code
          /tmp/control-claude-code --help

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The root workspace has to be installed too: the web type check reaches into ../src (ws.ts
      # type-imports store.ts → db.ts → pg) and module resolution for those files starts at the
      # repo root, not inside web/. This is the one place the full type graph is checked — the
      # Docker build deliberately runs `vite build` alone.
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run build # tsc --noEmit + vite build
        working-directory: web

# The server image is not built here: it is built, probed and pushed on tag, in release.yml.

